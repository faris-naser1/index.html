<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MatchTicketing</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <!-- Copy navigation from index.html -->
    </nav>

    <div class="form-container">
        <h2>Contact Us</h2>
        <form action="php/contact_form.php" method="POST" data-validation="true">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            
            <button type="submit" class="btn-primary">Send Message</button>
        </form>
        
        <div class="contact-info" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #eee;">
            <h3>Other Ways to Reach Us</h3>
            <p><i class="fas fa-envelope"></i> support@matchticketing.com</p>
            <p><i class="fas fa-phone"></i> +1 234 567 8900</p>
            <p><i class="fas fa-clock"></i> Mon-Fri: 9AM-6PM</p>
            <p><i class="fas fa-map-marker-alt"></i> 123 Sports Street, City, Country</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
